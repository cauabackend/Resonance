name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pipeline, api]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml
      - run: pip install -e ../shared -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy ${{ matrix.project == 'api' && 'app' || 'src' }}
      - run: pytest # cobertura mínima de 80% configurada no pyproject
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      # O contrato TS é gerado do OpenAPI: se divergir do backend, o build quebra.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: openapi.json em dia com a API
        run: |
          pip install -e ../shared -e ../api
          python -m app.export_openapi /tmp/openapi.json
          diff <(python -m json.tool /tmp/openapi.json) <(python -m json.tool ../web/openapi.json)
        working-directory: api
