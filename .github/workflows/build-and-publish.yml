name: build-and-publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resonance-api:latest
            ghcr.io/${{ github.repository_owner }}/resonance-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: build + push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resonance-web:latest
            ghcr.io/${{ github.repository_owner }}/resonance-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sobe a stack (mlflow + minio + api + web) e checa os endpoints
        run: |
          cp .env.example .env
          echo "MINIO_ROOT_PASSWORD=ci-smoke-$RANDOM$RANDOM" >> .env
          docker compose up -d --build mlflow web
          curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://localhost:5000/health
          curl --retry 15 --retry-delay 2 --retry-connrefused -fsS http://localhost:5173/ > /dev/null
          # A API fica "degraded" (503) até existir modelo em Production: o smoke exige que ela responda.
          docker compose up -d api
          curl --retry 30 --retry-delay 2 --retry-connrefused -sS http://localhost:8000/v1/health
          curl -fsS http://localhost:8000/openapi.json > /dev/null
      - if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=60 --no-color 2>&1 | tr '\n' '|'| head -c 3500 | sed 's/^/::error::/' || true
      - if: always()
        run: docker compose down -v
