[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-api"
version = "0.1.0"
description = "API de serving do Resonance (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "resonance-features",  # pip install -e ../shared (mesmo código de features do treino)
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.2",
  "structlog==26.1.0",
  "pandas==2.3.3",
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "xgboost==3.4.1",
  "shap==0.54.1",
  "joblib==1.6.0",
  "mlflow-skinny==3.17.2",
  "boto3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx==0.28.1", "ruff", "mypy", "pandas-stubs"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-fail-under=80"

[tool.ruff]
line-length = 120

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["B008"]  # Depends()/Query() em defaults é o idioma do FastAPI
