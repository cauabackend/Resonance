[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-features"
version = "0.1.0"
description = "Engenharia de features compartilhada entre o pipeline de treino e a API (sem train/serve skew)"
requires-python = ">=3.12"
dependencies = ["pandas==2.3.3", "numpy==2.5.4"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
