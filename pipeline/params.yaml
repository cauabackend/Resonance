data:
  raw: data/raw/dataset.csv
  clean: data/processed/clean.csv
  processed: data/processed/tracks.csv
  hit_threshold: 60         # só rótulo histórico do badge; NÃO é o alvo de treino
  max_duration_ms: 900000   # acima de 15 min = provável podcast/mix
  min_tempo: 30             # BPM abaixo disso = falha de detecção

analysis:
  sensitivity_thresholds: [55, 60, 65, 70]
  alpha: 0.05
  genre_cutoffs: [30, 50, 100, 200, 500]   # sensibilidade do corte de gêneros raros (features.min_genre_count)

split:
  test_size: 0.2            # split SEMPRE por artista
  calib_size: 0.25          # fração do treino reservada p/ calibração + threshold do badge
  seed: 42

features:
  min_genre_count: 100      # gêneros mais raros viram categoria "infrequent"
  artist_mask_rate: 0.5     # fração das linhas de treino sem histórico do artista (aprende a modalidade só-áudio)

xgb:                        # parâmetros fixos; max_depth/n_estimators vêm do grid abaixo
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8

tune:                       # loop interno do nested CV (docs/adr/0004)
  grid:
    max_depth: [6, 8]
    n_estimators: [400, 800]
  folds: 3

decision:                   # perder um hit custa mais que ouvir uma demo ruim (docs/adr/0003)
  fn_cost: 3
  fp_cost: 1

evaluate:
  cv_folds: 5               # loop externo do nested CV
  niche_genres: [grindcore, black-metal, study]
  ndcg_k: 50                # "as 50 melhores de 500 demos"
  batch_size: 500
  n_batches: 100
  gate_tolerance: 0.005     # ndcg@K e spearman
  brier_tolerance: 0.002
